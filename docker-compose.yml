version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: abhedya-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - sovereign-enclave

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abhedya-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    environment:
      - DATABASE_URL=postgresql://abhedya:confidential_pw@db:5432/sovereign_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      - db
      - qdrant
    networks:
      - sovereign-enclave

  db:
    image: postgres:16-alpine
    container_name: abhedya-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=abhedya
      - POSTGRES_PASSWORD=confidential_pw
      - POSTGRES_DB=sovereign_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sovereign-enclave

  qdrant:
    image: qdrant/qdrant:latest
    container_name: abhedya-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - sovereign-enclave

networks:
  sovereign-enclave:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
